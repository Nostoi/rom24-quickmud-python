name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  # Full suite on the version the pinned lock is built + proven green against
  # (local .venv is 3.12.3). Installing requirements-dev.txt gives the exact
  # known-good stack (pytest 8.x etc.) — the unpinned `.[dev,test]` floors
  # resolve to bleeding-edge pytest 9 / xdist 3.8, which crash xdist workers
  # ("node down: Not properly terminated") and abort the run with an
  # INTERNALERROR. See CHANGELOG 2.14.267.
  #
  # Cost: this run is ~32 CI-min. It is therefore gated to pull_request +
  # manual dispatch only — direct pushes to master run just the cheap smokes
  # below (the dev validates the full suite locally via .venv). See 2.14.268.
  test:
    name: Full suite (Python 3.12, pinned)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check .
        continue-on-error: true
      - name: Test with pytest
        timeout-minutes: 20
        # Inherits addopts (-n auto --dist loadscope --timeout=120) from pyproject.
        run: pytest --tb=short

  # Cheap floor/ceiling guard: import + collect every test module on the other
  # supported Pythons so version-specific breakage (e.g. `datetime.UTC`, a 3.11+
  # API, on 3.10) is caught for pennies without running the full suite. Uses the
  # unpinned extras deliberately — collection can't trigger the xdist worker
  # crash (no tests execute), and testing against latest deps here is a free
  # early-warning. addopts is cleared so no xdist/-n is involved.
  collect-smoke:
    name: Collect-only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Collect-only (guards imports on this Python)
        run: pytest --collect-only -q -o addopts=""
